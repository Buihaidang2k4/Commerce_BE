# ========================
# MySQL PROD (DOCKER)
# ========================
spring.datasource.url=${DBMS_CONNECTION}
spring.datasource.username=${DBMS_USERNAME}
spring.datasource.password=${DBMS_PASSWORD}
# ========================
# Redis PROD (DOCKER)
# ========================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
# docker compose --env-file .env.prod up -d --build
#  docker logs myshop-api-backend
#  docker inspect myshop-api-backend
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.example.MyShop_API=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
spring.thymeleaf.cache=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
app.cookie.secure=${COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.baseUrl=${FRONTEND_PAYMENT_RETURN_URL}
app.auth.rate-limit.store=${AUTH_RATE_LIMIT_STORE:redis}
