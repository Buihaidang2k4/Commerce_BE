services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DBMS_CONNECTION: jdbc:mysql://mysql:3306/${DBMS_NAME:?Set DBMS_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      DBMS_USERNAME: ${DBMS_USERNAME:?Set a non-root DBMS_USERNAME}
      DBMS_PASSWORD: ${DBMS_PASSWORD:?Set DBMS_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      REPORT_TEMP_DIR: /app/data/reports
      REPORT_EXCEL_TEMP_DIR: /app/data/excel
      TZ: Asia/Ho_Chi_Minh
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DBMS_NAME:?Set DBMS_NAME}
      MYSQL_USER: ${DBMS_USERNAME:?Set a non-root DBMS_USERNAME}
      MYSQL_PASSWORD: ${DBMS_PASSWORD:?Set DBMS_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - db_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_mysql:
  db_redis:
  minio_data:
